# External PostgreSQL deployment: no bundled database; JNexus connects to an external DB and auto-creates all tables.
#
# Usage:
#   1. Create the database on the external PostgreSQL first (no tables needed, the app migrates automatically):
#        CREATE DATABASE jnexus;
#        CREATE USER jnexus WITH PASSWORD 'yourpass';
#        GRANT ALL PRIVILEGES ON DATABASE jnexus TO jnexus;
#   2. Set the env vars and start:
#        export JNEXUS_DB_HOST=10.3.0.100
#        export JNEXUS_DB_PORT=5432
#        export JNEXUS_DB_USER=jnexus
#        export JNEXUS_DB_PASSWORD=yourpass
#        export JNEXUS_DB_NAME=jnexus
#        export JNEXUS_JWT_SECRET=<random long string>
#        export JNEXUS_AES_KEY=<generated by openssl rand -base64 32>
#        docker compose -f docker-compose.external.yml up -d --build
services:
  jnexus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # export JNEXUS_VERSION="1.$(git rev-list --count HEAD)" before building to inject the version
        APP_VERSION: ${JNEXUS_VERSION:-}
    container_name: jnexus-server
    environment:
      JNEXUS_DB_HOST: ${JNEXUS_DB_HOST:?请设置外部数据库地址}
      JNEXUS_DB_PORT: ${JNEXUS_DB_PORT:-5432}
      JNEXUS_DB_USER: ${JNEXUS_DB_USER:?请设置数据库用户}
      JNEXUS_DB_PASSWORD: ${JNEXUS_DB_PASSWORD:?请设置数据库密码}
      JNEXUS_DB_NAME: ${JNEXUS_DB_NAME:-jnexus}
      # JWT/AES secrets: auto-generated and persisted to the data volume by the entrypoint on first start if unset
      JNEXUS_JWT_SECRET: ${JNEXUS_JWT_SECRET:-}
      JNEXUS_AES_KEY: ${JNEXUS_AES_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    restart: unless-stopped

  # RDP graphical desktop gateway: browser ←WS← guacamole-lite ← guacd ← Windows 3389
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: jnexus-guacd
    restart: unless-stopped

  rdp-gateway:
    image: node:20-alpine
    container_name: jnexus-rdp-gateway
    working_dir: /gw
    volumes:
      - ../rdp-gateway:/gw
      - data:/data:ro
    command: sh -c "npm install --omit=dev && node server.js"
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      GW_PORT: "4823"
      # Secret is read from the gw_secret file on the shared data volume (same volume as jnexus-server), never stored in plaintext
    ports:
      - "4823:4823"
    depends_on:
      - jnexus
      - guacd
    restart: unless-stopped

volumes:
  uploads:
  data:
