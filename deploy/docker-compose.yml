# 默认：捆绑 PostgreSQL。
# 使用外部数据库：见 docker-compose.external.yml，或直接设置 JNEXUS_DB_* 环境变量后
# 运行 `docker compose up -d jnexus`（数据库/表结构由程序启动时自动创建）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: jnexus-pg
    environment:
      POSTGRES_USER: ${JNEXUS_DB_USER:-jnexus}
      POSTGRES_PASSWORD: ${JNEXUS_DB_PASSWORD:-jnexus123}
      POSTGRES_DB: ${JNEXUS_DB_NAME:-jnexus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jnexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  jnexus:
    image: jnexus:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 构建前 export JNEXUS_VERSION="1.$(git rev-list --count HEAD)" 可注入版本号
        APP_VERSION: ${JNEXUS_VERSION:-}
    container_name: jnexus-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 外部数据库只需修改以下变量（或设置 JNEXUS_DSN 使用完整 DSN）
      JNEXUS_DB_HOST: ${JNEXUS_DB_HOST:-postgres}
      JNEXUS_DB_PORT: ${JNEXUS_DB_PORT:-5432}
      JNEXUS_DB_USER: ${JNEXUS_DB_USER:-jnexus}
      JNEXUS_DB_PASSWORD: ${JNEXUS_DB_PASSWORD:-jnexus123}
      JNEXUS_DB_NAME: ${JNEXUS_DB_NAME:-jnexus}
      # JWT/AES 密钥：不设置时由容器入口首次启动自动生成并持久化到 data 卷
      JNEXUS_JWT_SECRET: ${JNEXUS_JWT_SECRET:-}
      JNEXUS_AES_KEY: ${JNEXUS_AES_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    restart: unless-stopped

  # RDP 图形桌面网关：浏览器 ←WS← guacamole-lite ← guacd ← Windows 3389
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: jnexus-guacd
    restart: unless-stopped

  rdp-gateway:
    image: node:20-alpine
    container_name: jnexus-rdp-gateway
    working_dir: /gw
    volumes:
      - ../rdp-gateway:/gw
      - data:/data:ro
    command: sh -c "npm install --omit=dev && node server.js"
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      GW_PORT: "4823"
      # 密钥从共享 data 卷的 gw_secret 文件读取（与 jnexus-server 同卷），无需明文
    ports:
      - "4823:4823"
    depends_on:
      - jnexus
      - guacd
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  data:
