# Default: bundled PostgreSQL.
# To use an external database: see docker-compose.external.yml, or set the JNEXUS_DB_* env vars and
# run `docker compose up -d jnexus` (database/schema are created automatically at startup).
services:
  postgres:
    image: postgres:16-alpine
    container_name: jnexus-pg
    environment:
      POSTGRES_USER: ${JNEXUS_DB_USER:-jnexus}
      POSTGRES_PASSWORD: ${JNEXUS_DB_PASSWORD:-jnexus123}
      POSTGRES_DB: ${JNEXUS_DB_NAME:-jnexus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jnexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  jnexus:
    image: jnexus:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # export JNEXUS_VERSION="1.$(git rev-list --count HEAD)" before building to inject the version
        APP_VERSION: ${JNEXUS_VERSION:-}
    container_name: jnexus-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # For an external database, just change the variables below (or set JNEXUS_DSN with a full DSN)
      JNEXUS_DB_HOST: ${JNEXUS_DB_HOST:-postgres}
      JNEXUS_DB_PORT: ${JNEXUS_DB_PORT:-5432}
      JNEXUS_DB_USER: ${JNEXUS_DB_USER:-jnexus}
      JNEXUS_DB_PASSWORD: ${JNEXUS_DB_PASSWORD:-jnexus123}
      JNEXUS_DB_NAME: ${JNEXUS_DB_NAME:-jnexus}
      # JWT/AES secrets: auto-generated and persisted to the data volume by the entrypoint on first start if unset
      JNEXUS_JWT_SECRET: ${JNEXUS_JWT_SECRET:-}
      JNEXUS_AES_KEY: ${JNEXUS_AES_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - data:/app/data
      # Host custom CA certificate directory (optional): drop in .crt/.pem files to have them trusted (LDAPS/HTTPS/K8s self-signed certs)
      - ./cacerts:/cacerts:ro
    restart: unless-stopped

  # RDP graphical desktop gateway: browser ←WS← guacamole-lite ← guacd ← Windows 3389
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: jnexus-guacd
    restart: unless-stopped

  rdp-gateway:
    image: node:20-alpine
    container_name: jnexus-rdp-gateway
    working_dir: /gw
    volumes:
      - ../rdp-gateway:/gw
      - data:/data:ro
    command: sh -c "npm install --omit=dev && node server.js"
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      GW_PORT: "4823"
      # Secret is read from the gw_secret file on the shared data volume (same volume as jnexus-server), never stored in plaintext
    ports:
      - "4823:4823"
    depends_on:
      - jnexus
      - guacd
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  data:
