# 默认：捆绑 PostgreSQL。
# 使用外部数据库：见 docker-compose.external.yml，或直接设置 AUTOOPS_DB_* 环境变量后
# 运行 `docker compose up -d autoops`（数据库/表结构由程序启动时自动创建）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: autoops-pg
    environment:
      POSTGRES_USER: ${AUTOOPS_DB_USER:-autoops}
      POSTGRES_PASSWORD: ${AUTOOPS_DB_PASSWORD:-autoops123}
      POSTGRES_DB: ${AUTOOPS_DB_NAME:-autoops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoops"]
      interval: 5s
      timeout: 3s
      retries: 10

  autoops:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: autoops-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 外部数据库只需修改以下变量（或设置 AUTOOPS_DSN 使用完整 DSN）
      AUTOOPS_DB_HOST: ${AUTOOPS_DB_HOST:-postgres}
      AUTOOPS_DB_PORT: ${AUTOOPS_DB_PORT:-5432}
      AUTOOPS_DB_USER: ${AUTOOPS_DB_USER:-autoops}
      AUTOOPS_DB_PASSWORD: ${AUTOOPS_DB_PASSWORD:-autoops123}
      AUTOOPS_DB_NAME: ${AUTOOPS_DB_NAME:-autoops}
      # JWT/AES 密钥：不设置时由容器入口首次启动自动生成并持久化到 data 卷
      AUTOOPS_JWT_SECRET: ${AUTOOPS_JWT_SECRET:-}
      AUTOOPS_AES_KEY: ${AUTOOPS_AES_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  data:
