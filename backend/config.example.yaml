# AutoOps 配置示例。复制为 config.yaml 后修改。
# 生成主密钥: 运行 `autoops-server -genkey` 或使用 README 中的命令

server:
  port: 8080
  mode: release   # debug / release

database:
  # 外部 PostgreSQL
  dsn: "host=127.0.0.1 port=5432 user=autoops password=autoops123 dbname=autoops sslmode=disable"

auth:
  jwt_secret: "change-me-to-a-long-random-string"
  # 32 字节 base64 编码主密钥，用于加密落库的 SSH 私钥/密码
  # Linux 生成: openssl rand -base64 32
  aes_key: "PLEASE_REPLACE_WITH_BASE64_32BYTES_KEY=="

storage:
  upload_dir: "./uploads"

# 环境变量可覆盖以上配置（优先级：AUTOOPS_DSN > AUTOOPS_DB_* > 本文件）：
#   AUTOOPS_DSN / AUTOOPS_DB_HOST / AUTOOPS_DB_PORT / AUTOOPS_DB_USER /
#   AUTOOPS_DB_PASSWORD / AUTOOPS_DB_NAME / AUTOOPS_JWT_SECRET / AUTOOPS_AES_KEY
# Docker 外部数据库部署见 deploy/docker-compose.external.yml
