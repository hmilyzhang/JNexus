# JNexus 配置示例。复制为 config.yaml 后修改。
# 生成主密钥: 运行 `jnexus-server -genkey` 或使用 README 中的命令

server:
  port: 8080
  mode: release   # debug / release

database:
  # 外部 PostgreSQL
  dsn: "host=127.0.0.1 port=5432 user=jnexus password=jnexus123 dbname=jnexus sslmode=disable"

auth:
  jwt_secret: "change-me-to-a-long-random-string"
  # 32 字节 base64 编码主密钥，用于加密落库的 SSH 私钥/密码
  # Linux 生成: openssl rand -base64 32
  aes_key: "PLEASE_REPLACE_WITH_BASE64_32BYTES_KEY=="

storage:
  upload_dir: "./uploads"

# 环境变量可覆盖以上配置（优先级：JNEXUS_DSN > JNEXUS_DB_* > 本文件）：
#   JNEXUS_DSN / JNEXUS_DB_HOST / JNEXUS_DB_PORT / JNEXUS_DB_USER /
#   JNEXUS_DB_PASSWORD / JNEXUS_DB_NAME / JNEXUS_JWT_SECRET / JNEXUS_AES_KEY
# Docker 外部数据库部署见 deploy/docker-compose.external.yml
