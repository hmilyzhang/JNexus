# Build and publish the JNexus image to Docker Hub on every push to main.
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - your Docker Hub user name
#   DOCKERHUB_TOKEN    - Docker Hub access token (Account Settings -> Security)
# Tags pushed: <dockerhub-repo>:<VERSION> and <dockerhub-repo>:latest,
# where VERSION comes from the repository VERSION file.
name: docker

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cut -d. -f1,2 VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (version + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jnexus:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jnexus:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
